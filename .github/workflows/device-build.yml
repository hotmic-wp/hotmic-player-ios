name: Demo device build

# Unsigned arm64 device build of the BRPlayerDemo Sample target plus its XCTest UI runner,
# packaged for Device Farm (which re-signs for its devices). Manual dispatch from any branch,
# and pull requests that touch this build or the demo target. Partner release checks are separate.
# A dispatch with `testflight` ticked also archives Release, signs it with the App Store
# distribution secrets and uploads it to TestFlight; pull requests never sign or upload.
"on":
  workflow_dispatch:
    inputs:
      configuration:
        description: Debug (default; UI walkthrough and lab screens work) or Release (optimised, no local-networking ATS exception)
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      walkthrough:
        description: Bundle walkthrough.txt so EngagementWalkthroughUITests runs on Device Farm (needs Debug)
        required: false
        default: true
        type: boolean
      testflight:
        description: Also archive Release, sign it for the App Store and upload it to TestFlight (needs the TestFlight secrets)
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/device-build.yml
      - .github/scripts/package-device-build.py
      - .github/scripts/prepare-testflight.py
      - Sample/BRPlayerDemo/**
      - Sample/HotMicPlayerDemo.xcodeproj/**

permissions:
  contents: read

concurrency:
  group: demo-device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP: BRPlayerDemo
      TESTS: BRPlayerDemoUITests
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      WALKTHROUGH: ${{ github.event_name != 'workflow_dispatch' || inputs.walkthrough }}
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCTS: .bench/device/Build/Products/${{ inputs.configuration || 'Debug' }}-iphoneos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26.6
        run: bash .github/scripts/require-xcode-26.6.sh
      - name: Build the device app and XCTest UI runner, unsigned
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Sample/HotMicPlayerDemo.xcodeproj -scheme "$APP" \
            -configuration "$CONFIGURATION" -destination 'generic/platform=iOS' \
            -derivedDataPath .bench/device ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          test "$(lipo -archs "$PRODUCTS/$APP.app/$APP")" = arm64
      - name: Stamp the build sha and the walkthrough opt-in
        run: |
          set -euo pipefail
          plist="$PRODUCTS/$APP.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HMBuildSHA $BUILD_SHA" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :HMBuildSHA string $BUILD_SHA" "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :HMBuildSHA' "$plist")" = "$BUILD_SHA"
          if [ "$WALKTHROUGH" = true ]; then
            printf 'testWalkthrough\n' > "$PRODUCTS/$TESTS-Runner.app/PlugIns/$TESTS.xctest/walkthrough.txt"
          fi
      - name: Package Device Farm artifacts
        run: |
          set -euo pipefail
          python3 .github/scripts/package-device-build.py \
            --products "$PRODUCTS" --app "$APP" --tests "$TESTS" --output .bench/device-artifacts
          printf 'configuration: %s\nbuild_sha: %s\nrun_sha: %s\nref: %s\nwalkthrough: %s\n' \
            "$CONFIGURATION" "$BUILD_SHA" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$WALKTHROUGH" >> .bench/device-artifacts/README.txt
          {
            echo "### $APP device build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| build sha | \`$BUILD_SHA\` |"
            echo "| ref | \`$GITHUB_REF_NAME\` |"
            echo "| configuration | $CONFIGURATION |"
            echo "| walkthrough bundled | $WALKTHROUGH |"
            echo "| $APP.ipa | $(du -h ".bench/device-artifacts/$APP.ipa" | cut -f1) |"
            echo "| $TESTS.zip | $(du -h ".bench/device-artifacts/$TESTS.zip" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build_sha=$BUILD_SHA"
      - name: Upload app IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-demo-ios-app
          path: .bench/device-artifacts/${{ env.APP }}.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload XCTest UI runner ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-demo-xctest-ui
          path: .bench/device-artifacts/${{ env.TESTS }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-demo-build-notes
          path: .bench/device-artifacts/README.txt
          retention-days: 14

  testflight:
    # Signed Release archive → TestFlight. Dispatch only, so pull requests stay unsigned.
    # Secrets come from the provisioning wizard; a missing one fails the first step by name.
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP: BRPlayerDemo
      BUNDLE_ID: com.hotmic.BRPlayerDemo
      PROJECT: Sample/HotMicPlayerDemo.xcodeproj
      BUILD_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Require the TestFlight secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID ASC_APP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 \
                      IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_APPSTORE_PROFILE_BASE64; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=TestFlight secrets missing::Not set on this repository:$missing. Nothing was built or uploaded."
            {
              echo "### TestFlight upload not attempted"
              echo
              echo "Missing repository secrets:$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26.6
        run: bash .github/scripts/require-xcode-26.6.sh
      - name: Install the distribution certificate and App Store profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/testflight"
          mkdir -p "$work"
          keychain="$work/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$IOS_DIST_P12_BASE64" | openssl base64 -d -A > "$work/distribution.p12"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | openssl base64 -d -A > "$work/profile.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          curl -fsSL -o "$work/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$work/AppleWWDRCAG3.cer" -k "$keychain" -t cert -A >/dev/null
          if ! security import "$work/distribution.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -f pkcs12 -t agg -A >/dev/null; then
            echo "::error title=TestFlight signing::IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD did not import (wrong password or not a .p12)"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          identities=$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Distribution/ {print $2}')
          if [ -z "$identities" ]; then
            echo "::error title=TestFlight signing::no valid Apple Distribution identity in IOS_DIST_P12_BASE64 (expired, revoked, or not a distribution certificate)"
            exit 1
          fi
          security cms -D -i "$work/profile.mobileprovision" > "$work/profile.plist"
          args=""
          for sha in $identities; do args="$args --identity-sha1 $sha"; done
          # shellcheck disable=SC2086
          python3 .github/scripts/prepare-testflight.py check-profile --profile-plist "$work/profile.plist" \
            --team "$APPLE_TEAM_ID" --bundle-id "$BUNDLE_ID" $args > "$work/profile.env"
          cat "$work/profile.env" >> "$GITHUB_ENV"
          PROFILE_UUID=$(sed -n 's/^PROFILE_UUID=//p' "$work/profile.env")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$work/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          rm -f "$work/distribution.p12"
          {
            echo "TESTFLIGHT_WORK=$work"
            echo "KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          cat "$work/profile.env"
      - name: Pin distribution signing on the app target
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-testflight.py pin-signing --project "$PROJECT" --bundle-id "$BUNDLE_ID" \
            --team "$APPLE_TEAM_ID" --profile-name "$PROFILE_NAME" --build-number "$BUILD_NUMBER" \
            --build-sha "$BUILD_SHA" --info-plist TestFlight-Info.plist \
            --export-options "$TESTFLIGHT_WORK/ExportOptions.plist"
          xcodebuild -showBuildSettings -project "$PROJECT" -target "$APP" -configuration Release \
            | grep -E ' (CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CURRENT_PROJECT_VERSION|MARKETING_VERSION|INFOPLIST_FILE) = '
      - name: Archive Release, signed
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$APP" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath .bench/testflight \
            -archivePath "$TESTFLIGHT_WORK/$APP.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          plist="$TESTFLIGHT_WORK/$APP.xcarchive/Products/Applications/$APP.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :HMBuildSHA' "$plist")" = "$BUILD_SHA"
          echo "MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" >> "$GITHUB_ENV"
      - name: Export the App Store IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$TESTFLIGHT_WORK/$APP.xcarchive" \
            -exportOptionsPlist "$TESTFLIGHT_WORK/ExportOptions.plist" \
            -exportPath "$TESTFLIGHT_WORK/export"
          test -f "$TESTFLIGHT_WORK/export/$APP.ipa"
      - name: Upload to TestFlight
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "$TESTFLIGHT_WORK/export/$APP.ipa" --type ios \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "$MARKETING_VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          {
            echo "### $APP uploaded to TestFlight"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| version (build) | $MARKETING_VERSION ($BUILD_NUMBER) |"
            echo "| build sha | \`$BUILD_SHA\` |"
            echo "| ref | \`$GITHUB_REF_NAME\` |"
            echo "| profile | $PROFILE_NAME |"
            echo
            echo "Apple processes the build for 5-30 minutes; an internal group with automatic distribution then gets it in the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys" "${TESTFLIGHT_WORK:-$RUNNER_TEMP/testflight}"
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          [ -z "${PROFILE_UUID:-}" ] || rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
