name: Partner release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Require Xcode 26.6 for reproducible API exports
        run: |
          if [[ ! -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]]; then
            echo "::error::Xcode 26.6 is required but is missing at $DEVELOPER_DIR. Install it on the runner before running the API drift check."
            exit 1
          fi
          version=$(xcodebuild -version)
          if [[ "${version%%$'\n'*}" != 'Xcode 26.6' ]]; then
            echo "::error::Expected Xcode 26.6 at $DEVELOPER_DIR; found $version. The API inventory must use the pinned toolchain."
            exit 1
          fi
          printf '%s\n' "$version"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check partner docs and API; build products and run the unit suite once
        env:
          PARTNER_DOCS_DENYLIST: ${{ secrets.PARTNER_DOCS_DENYLIST }}
        run: bash .github/scripts/validate-release.sh
      - name: Upload validation evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-validation-failure
          path: |
            .bench/release/*.log
            .bench/release/UnitTests.xcresult
          retention-days: 7
