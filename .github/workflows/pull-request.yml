name: Partner release checks

# pull_request plus push to main. A main run seeds actions/cache; pull requests
# restore that default-branch cache. Each job has its own runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26.6 for reproducible API exports
        run: bash .github/scripts/require-xcode-26.6.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .bench/unit/DerivedData/SourcePackages
            .bench/unit/DerivedData/ModuleCache.noindex
          key: swiftpm-unit-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-26.6
          restore-keys: |
            swiftpm-unit-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-
            swiftpm-unit-
      - name: Build and run the package unit tests
        run: bash .github/scripts/ci-unit-tests.sh
      - name: Upload unit-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-unit-tests-failure
          path: |
            .bench/unit/*.log
            .bench/unit/UnitTests.xcresult
          retention-days: 7

  apps:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26.6 for reproducible API exports
        run: bash .github/scripts/require-xcode-26.6.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .bench/apps/DerivedData/SourcePackages
            .bench/apps/DerivedData/ModuleCache.noindex
          key: swiftpm-apps-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-26.6
          restore-keys: |
            swiftpm-apps-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-
            swiftpm-apps-
      - name: Compile Sample and Examples for the simulator
        run: bash .github/scripts/ci-apps.sh
      - name: Upload app-build evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-apps-failure
          path: .bench/apps/*.log
          retention-days: 7

  checks:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26.6 for reproducible API exports
        run: bash .github/scripts/require-xcode-26.6.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .bench/checks/DerivedData/SourcePackages
            .bench/checks/DerivedData/ModuleCache.noindex
          key: swiftpm-checks-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-26.6
          restore-keys: |
            swiftpm-checks-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-
            swiftpm-checks-
      - name: Check partner docs, device libraries, DocC, and API drift
        env:
          PARTNER_DOCS_DENYLIST: ${{ secrets.PARTNER_DOCS_DENYLIST }}
        run: bash .github/scripts/ci-checks.sh
      - name: Upload check evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-checks-failure
          path: .bench/checks/*.log
          retention-days: 7
